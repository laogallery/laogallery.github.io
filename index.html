<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>图片画廊</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#14161a;color:#e8eaed;min-height:100vh}
.top{background:linear-gradient(135deg,#1a1c22,#242833);padding:26px 20px;text-align:center;border-bottom:1px solid #2c313c}
.top h1{font-size:30px;background:linear-gradient(90deg,#ffb74d,#ff7043);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.top p{color:#9aa0aa;font-size:14px;margin-top:6px}
.admin-link{position:fixed;right:14px;bottom:14px;background:#242833;border:1px solid #ff7043;color:#ffb74d;padding:8px 14px;border-radius:20px;font-size:12px;text-decoration:none;z-index:50}
.back{display:inline-block;margin:18px auto 0;color:#ffb74d;background:#242833;border:1px solid #333946;border-radius:20px;padding:7px 18px;font-size:13px;cursor:pointer;text-decoration:none}
.wrap{max-width:1200px;margin:0 auto;padding:10px 20px 50px}

/* 主页：分类文件夹墙 */
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px;padding:30px 10px}
.folder{background:#1e2127;border:1px solid #2c313c;border-radius:16px;padding:14px;text-align:center;cursor:pointer;transition:.25s;position:relative}
.folder:hover{transform:translateY(-5px);border-color:#ff7043;box-shadow:0 10px 26px rgba(255,112,67,.18)}
.folder .icon{width:100%;height:130px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#292d37;overflow:hidden;margin-bottom:10px}
.folder .icon img{width:100%;height:100%;object-fit:cover;display:block}
.folder .icon .emoji{font-size:58px}
.folder .nm{font-size:15px;font-weight:700;color:#ffb74d}
.folder .cnt{font-size:12px;color:#8a9099;margin-top:3px}
.folder .tab{position:absolute;top:8px;left:8px;background:rgba(255,112,67,.9);color:#fff;font-size:10px;padding:2px 8px;border-radius:8px}
.empty{text-align:center;color:#666;padding:80px 0;font-size:15px}

/* 分类内：图片瀑布流 */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;padding:26px 10px}
.pic{position:relative;border-radius:12px;overflow:hidden;cursor:pointer;background:#1e2127;border:1px solid #2c313c;display:flex;align-items:center;justify-content:center;height:260px}
.pic img{display:block;margin:auto;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;transition:.3s}
.pic:hover img{transform:scale(1.04)}
.pic .tip{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 7px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:12px;color:#fff;text-align:center}

#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:99;align-items:center;justify-content:center;flex-direction:column}
#lightbox img{max-width:92%;max-height:82%;border-radius:10px}
#lightbox .cap{color:#ddd;margin-top:12px;font-size:15px}
#lightbox .close{position:absolute;top:18px;right:26px;font-size:34px;cursor:pointer;color:#fff}
.footer{text-align:center;color:#666;font-size:12px;padding:18px}
</style>
</head>
<body>
<div class="top">
  <h1 id="siteTitle">图片画廊</h1>
  <p id="siteDesc">点击分类文件夹查看图片</p>
</div>
<div class="wrap">
  <div id="view"></div>
</div>
<a class="admin-link" href="./admin/">⚙️ 管理后台</a>
<div class="footer">laogallery · Powered by GitHub Pages</div>
<div id="lightbox" onclick="this.style.display='none'">
  <span class="close">×</span><img id="lbImg" src=""><div class="cap" id="lbCap"></div>
</div>
<script>
var cats=[],settings={siteTitle:"图片画廊",siteDesc:"点击分类文件夹查看图片"};
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function loadAll(){
  return Promise.all([
    fetch("content/settings.json?t="+Date.now()).then(function(r){return r.json();}).catch(function(){return settings;}),
    fetch("content/index.json?t="+Date.now()).then(function(r){return r.json();}).catch(function(){return [];})
  ]).then(function(res){
    settings=res[0];cats=res[1]||[];renderHome();
  });
}
function renderHome(){
  document.getElementById("siteTitle").textContent=settings.siteTitle||"图片画廊";
  document.getElementById("siteDesc").textContent=settings.siteDesc||"点击分类文件夹查看图片";
  var v=document.getElementById("view");
  if(!cats.length){v.innerHTML='<div class="empty">暂无分类</div>';return;}
  var h='<div class="folders">';
  cats.forEach(function(c,i){
    var cover=(c.images&&c.images.length)?'<img src="'+c.images[0].src+'" alt="">':'<div class="emoji">📁</div>';
    h+='<div class="folder" onclick="openCat('+i+')"><div class="icon">'+cover+'</div><div class="nm">'+esc(c.name)+'</div><div class="cnt">'+(c.images?c.images.length:0)+' 张图片</div></div>';
  });
  h+='</div>';
  v.innerHTML=h;
}
function openCat(i){
  var c=cats[i];var imgs=c.images||[];
  var v=document.getElementById("view");
  var h='<a class="back" href="javascript:renderHome()">← 返回主页</a>';
  h+='<div style="margin:22px 4px 0"><span style="font-size:24px;font-weight:800;color:#ffb74d">'+esc(c.name)+'</span> <span style="color:#8a9099;font-size:14px">'+(c.desc||"")+' · '+imgs.length+' 张</span></div>';
  if(!imgs.length){h+='<div class="empty">该分类暂无图片</div>';}
  else{
    h+='<div class="gallery">';
    imgs.forEach(function(im){
      h+='<div class="pic" onclick="openLightbox(\''+im.src.replace(/'/g,"\\'")+'\',\''+esc(im.title||"")+'\')"><img src="'+im.src+'" loading="lazy" alt=""><div class="tip">'+esc(im.title||"")+'</div></div>';
    });
    h+='</div>';
  }
  v.innerHTML=h;
  window.scrollTo(0,0);
}
function openLightbox(src,title){document.getElementById("lbImg").src=src;document.getElementById("lbCap").textContent=title;document.getElementById("lightbox").style.display="flex";}
loadAll();
</script>
</body>
</html>
