<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>最新课表展示</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f7f8fa;color:#2b2f36;min-height:100vh}
.top{background:#fff;padding:24px 16px;text-align:center;border-bottom:1px solid #eee;box-shadow:0 1px 6px rgba(0,0,0,.04)}
.top h1{font-size:24px;color:#1f2937}
.top p{color:#9aa0aa;font-size:13px;margin-top:5px}
.wrap{max-width:900px;margin:0 auto;padding:20px 14px 60px}
.bread{font-size:13px;color:#ff7043;cursor:pointer;margin-bottom:14px;display:inline-block}
/* 主页分类卡片 */
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.folder{background:#fff;border-radius:14px;padding:18px 10px;text-align:center;cursor:pointer;border:1px solid #edf0f4;box-shadow:0 2px 8px rgba(0,0,0,.05);transition:.2s}
.folder:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.1)}
.folder .ic{font-size:44px;display:block;margin-bottom:8px}
.folder .nm{font-size:15px;font-weight:700;color:#1f2937}
.folder .cnt{font-size:12px;color:#9aa0aa;margin-top:3px}
/* 分类内图片 */
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.pic{background:#fff;border-radius:12px;overflow:hidden;cursor:pointer;border:1px solid #edf0f4;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.pic img{width:100%;display:block;max-height:320px;object-fit:contain;background:#f0f1f3}
.cat-title{font-size:20px;font-weight:800;color:#1f2937;margin:4px 0 2px}
.cat-sub{font-size:13px;color:#9aa0aa;margin-bottom:14px}
.empty{text-align:center;color:#bbb;padding:50px 0;font-size:14px}
#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99;align-items:center;justify-content:center;flex-direction:column}
#lb img{max-width:94%;max-height:86%;border-radius:8px}
#lb .c{color:#ddd;margin-top:10px;font-size:14px}
#lb .x{position:absolute;top:16px;right:24px;font-size:32px;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="top">
  <h1 id="t">最新课表展示</h1>
  <p id="s">点击分类查看课表</p>
</div>
<div class="wrap">
  <span class="bread" id="back" style="display:none" onclick="home()">← 返回</span>
  <div id="v"></div>
</div>
<div id="lb" onclick="this.style.display='none'"><span class="x">×</span><img id="bi"><div class="c" id="bc"></div></div>
<script>
var cats=[],st={siteTitle:"最新课表展示",siteDesc:"点击分类查看课表"};
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function load(){
  Promise.all([
    fetch("content/settings.json?t="+Date.now()).then(r=>r.json()).catch(()=>st),
    fetch("content/index.json?t="+Date.now()).then(r=>r.json()).catch(()=>[])
  ]).then(([s,c])=>{st=s;cats=c;home();});
}
function home(){
  document.getElementById("t").textContent=st.siteTitle||"最新课表展示";
  document.getElementById("s").textContent=st.siteDesc||"点击分类查看课表";
  document.getElementById("back").style.display="none";
  var v=document.getElementById("v");
  if(!cats.length){v.innerHTML='<div class="empty">暂无分类</div>';return;}
  v.innerHTML='<div class="folders">'+cats.map(function(c,i){
    return '<div class="folder" onclick="openCat('+i+')"><span class="ic">📁</span><div class="nm">'+esc(c.name)+'</div><div class="cnt">'+(c.images?c.images.length:0)+' 张</div></div>';
  }).join('')+'</div>';
}
function openCat(i){
  var c=cats[i],imgs=c.images||[];
  document.getElementById("t").textContent=c.name;
  document.getElementById("s").textContent=c.desc||"";
  document.getElementById("back").style.display="inline-block";
  var v=document.getElementById("v");
  if(!imgs.length){v.innerHTML='<div class="empty">暂无课表图片</div>';return;}
  v.innerHTML='<div class="pics">'+imgs.map(function(im,j){
    return '<div class="pic" onclick="lb(\''+im.src.replace(/'/g,"\\'")+'\')"><img src="'+im.src+'" loading="lazy"></div>';
  }).join('')+'</div>';
  window.scrollTo(0,0);
}
function lb(src){document.getElementById("bi").src=src;document.getElementById("bc").textContent="";document.getElementById("lb").style.display="flex";}
load();
setInterval(function(){
  fetch("content/index.json?t="+Date.now()).then(r=>r.json()).catch(()=>null).then(d=>{
    if(d&&JSON.stringify(d)!==JSON.stringify(cats)){cats=d;home();}
  });
},20000);
</script>
</body>
</html>
