<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>课表管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f5f7;color:#2b2f36;padding:16px;max-width:800px;margin:0 auto}
h1{font-size:22px;margin-bottom:4px}
.sub{color:#888;font-size:12px;margin-bottom:16px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.card h2{font-size:16px;margin-bottom:10px;border-left:4px solid #ff7043;padding-left:8px}
label{display:block;font-size:12px;color:#555;margin:8px 0 3px}
input{width:100%;padding:9px 10px;border:1px solid #d5d9e0;border-radius:8px;font-size:14px;box-sizing:border-box}
.btn{display:inline-block;background:#ff7043;color:#fff;border:none;padding:9px 18px;border-radius:8px;font-size:14px;cursor:pointer;margin:6px 4px 0 0}
.btn.g{background:#6b7280}.btn.r{background:#dc2626}.btn.b{background:#10b981}
.cat{background:#f8f9fb;border:1px solid #e5e8ee;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.cat .top{display:flex;justify-content:space-between;align-items:center}
.cat .nm{font-weight:700}
.cat .cnt{color:#999;font-size:12px}
.sm{padding:5px 10px !important;font-size:12px !important;margin:2px 0 0 4px}
.imgs{margin-top:8px}
.thumb{width:52px;height:65px;object-fit:cover;border-radius:6px;margin:3px;position:relative;display:inline-block;vertical-align:top}
.thumb .x{position:absolute;top:-5px;right:-5px;background:#dc2626;color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer}
textarea{width:100%;height:90px;border:1px solid #d5d9e0;border-radius:8px;font-size:11px;padding:8px;box-sizing:border-box}
.tip{font-size:11px;color:#999;margin-top:6px;line-height:1.7}
.pub{background:#fff7e6;border-radius:10px;padding:12px;margin-top:10px;border:1px solid #ffe1a8;font-size:12px;line-height:1.8;color:#8a6d1a}
</style>
</head>
<body>
<h1>📚 课表管理（极简版）</h1>
<p class="sub">本地编辑 → 点「发布」→ 把内容发我 → 我上线，前台自动更新</p>

<div class="card">
  <h2>⚙️ 网站名称</h2>
  <label>标题</label><input id="siteTitle" placeholder="最新课表展示">
  <label>副标题</label><input id="siteDesc" placeholder="点击分类文件夹查看课表">
  <button class="btn b" onclick="saveSite()">💾 保存</button>
</div>

<div class="card">
  <h2>📁 分类管理</h2>
  <div style="display:flex;gap:6px">
    <input id="newName" placeholder="分类名（如：高三课表）" style="flex:2">
    <input id="newDesc" placeholder="描述(可选)" style="flex:2">
    <button class="btn" onclick="addCat()">➕</button>
  </div>
  <div id="catList" style="margin-top:10px"></div>
</div>

<div class="card" id="imgCard" style="display:none">
  <h2>🖼️ 图片：<span id="curCatN"></span></h2>
  <input type="file" id="file" accept="image/*" multiple>
  <button class="btn g" onclick="addPics()">⬆️ 添加所选图片</button>
  <div id="imgList" class="imgs"></div>
</div>

<div class="card">
  <h2>📤 发布到网站</h2>
  <button class="btn" onclick="genPublish()">📤 生成发布内容</button>
  <div id="pubBox" style="display:none;margin-top:10px">
    <textarea id="pubText" readonly></textarea>
    <div class="pub">① 点「复制」② 把内容粘贴发给我（或下载文件发我）③ 我上线后前台自动更新 ✅</div>
    <button class="btn g" onclick="copyPub()">📋 复制</button>
    <button class="btn g" onclick="downPub()">⬇️ 下载文件</button>
  </div>
</div>

<script>
var KEY="gallery_v2";
var data={siteTitle:"最新课表展示",siteDesc:"点击分类文件夹查看课表",cats:[]},cur=-1;
function load(){try{var s=localStorage.getItem(KEY);data=s?JSON.parse(s):data;}catch(e){data={siteTitle:"最新课表展示",siteDesc:"点击分类文件夹查看课表",cats:[]};}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function render(){
  document.getElementById("siteTitle").value=data.siteTitle;
  document.getElementById("siteDesc").value=data.siteDesc;
  var b=document.getElementById("catList");b.innerHTML="";
  if(!data.cats.length){b.innerHTML='<div class="tip" style="padding:8px">还没有分类，先添加一个吧</div>';}
  data.cats.forEach(function(c,i){
    var d=document.createElement("div");d.className="cat";
    d.innerHTML='<div class="top"><div><span class="nm">'+esc(c.name)+'</span> <span class="cnt">'+(c.images?c.images.length:0)+' 张</span></div><div><button class="btn sm g" onclick="openCat('+i+')">📷 图</button><button class="btn sm g" onclick="editCat('+i+')">✏️</button><button class="btn sm g" onclick="moveCat('+i+',-1)">↑</button><button class="btn sm g" onclick="moveCat('+i+',1)">↓</button><button class="btn sm r" onclick="delCat('+i+')">🗑️</button></div></div>';
    b.appendChild(d);
  });
}
function saveSite(){data.siteTitle=document.getElementById("siteTitle").value;data.siteDesc=document.getElementById("siteDesc").value;save();alert("✅ 已保存");}
function addCat(){
  var n=document.getElementById("newName").value.trim();if(!n){alert("请输入分类名");return;}
  data.cats.push({name:n,desc:document.getElementById("newDesc").value.trim(),images:[]});
  document.getElementById("newName").value="";document.getElementById("newDesc").value="";
  save();render();alert("✅ 已添加分类（别忘了最后点「发布」）");
}
function editCat(i){var n=prompt("分类名",data.cats[i].name);if(n==null)return;var d=prompt("描述",data.cats[i].desc||"");if(d==null)return;data.cats[i].name=n;data.cats[i].desc=d;save();render();}
function delCat(i){if(!confirm("删除该分类？"))return;data.cats.splice(i,1);if(cur===i){cur=-1;document.getElementById("imgCard").style.display="none";}save();render();}
function moveCat(i,dir){var j=i+dir;if(j<0||j>=data.cats.length)return;var t=data.cats[i];data.cats[i]=data.cats[j];data.cats[j]=t;save();render();}
function openCat(i){cur=i;document.getElementById("curCatN").textContent=data.cats[i].name;document.getElementById("imgCard").style.display="block";renderImgs();}
function renderImgs(){
  var b=document.getElementById("imgList");b.innerHTML="";
  (data.cats[cur].images||[]).forEach(function(im,j){
    var w=document.createElement("span");w.className="thumb";w.style.position="relative";
    w.innerHTML='<img src="'+im.src+'" style="width:52px;height:65px;object-fit:cover;border-radius:6px"><button class="x" onclick="delImg('+j+')">×</button>';
    b.appendChild(w);
  });
}
function delImg(j){data.cats[cur].images.splice(j,1);save();renderImgs();}
function addPics(){
  var fs=document.getElementById("file").files;if(!fs.length){alert("请选择图片");return;}
  var arr=Array.from(fs).filter(function(f){return f.type.startsWith("image/");});
  var done=0;
  function next(){
    if(done>=arr.length){save();renderImgs();document.getElementById("file").value="";alert("✅ 已添加 "+arr.length+" 张（别忘了发布）");return;}
    var f=arr[done],r=new FileReader();
    r.onload=function(e){
      var img=new Image();
      img.onload=function(){
        var max=1000,w=img.width,h=img.height;
        if(w>max){h=h*max/w;w=max;}
        var c=document.createElement("canvas");c.width=w;c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        var src=c.toDataURL("image/jpeg",0.65);
        data.cats[cur].images.push({src:src,title:""});
        done++;next();
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(f);
  }
  next();
}
function genPublish(){
  document.getElementById("pubText").value=JSON.stringify(data);
  document.getElementById("pubBox").style.display="block";
  alert("✅ 发布内容已生成\n点「复制」→ 粘贴发给我");
}
function copyPub(){
  var t=document.getElementById("pubText");
  t.select();document.execCommand("copy");
  alert("✅ 已复制！请粘贴发给我，我这边上线");
}
function downPub(){
  var blob=new Blob([document.getElementById("pubText").value],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="课表数据.json";a.click();
  alert("✅ 文件已下载，把它发给我即可");
}
load();render();
</script>
</body>
</html>
