<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>课表管理后台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f5f7;color:#2b2f36;padding:16px;max-width:820px;margin:0 auto}
h1{font-size:22px}
.sub{color:#888;font-size:12px;margin:4px 0 14px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.card h2{font-size:16px;margin-bottom:10px;border-left:4px solid #ff7043;padding-left:8px}
label{display:block;font-size:12px;color:#555;margin:8px 0 3px}
input{width:100%;padding:9px 10px;border:1px solid #d5d9e0;border-radius:8px;font-size:14px;box-sizing:border-box}
.btn{display:inline-block;background:#ff7043;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:14px;cursor:pointer;margin:6px 4px 0 0}
.btn.g{background:#6b7280}.btn.r{background:#dc2626}.btn.b{background:#10b981}
.cat{background:#f8f9fb;border:1px solid #e5e8ee;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.cat .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.cat .nm{font-weight:700}.cat .cnt{color:#999;font-size:12px}
.sm{padding:5px 10px !important;font-size:12px !important;margin:0 0 0 4px}
.imgs{margin-top:8px}
.thumb{width:56px;height:70px;object-fit:cover;border-radius:6px;margin:3px;position:relative;display:inline-block;vertical-align:top}
.thumb .x{position:absolute;top:-5px;right:-5px;background:#dc2626;color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer}
#st{font-size:13px;color:#666;min-height:20px;margin-top:8px}
.pubbtn{background:#10b981;width:100%;text-align:center;font-size:16px;padding:14px;font-weight:700}
.tip{font-size:11px;color:#999;margin-top:8px;line-height:1.8}
.login{max-width:420px;margin:50px auto;background:#fff;border-radius:14px;padding:28px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
</style>
</head>
<body>
<div id="loginBox" class="login">
  <h1 style="text-align:center">🔐 后台登录</h1>
  <p class="sub" style="text-align:center">填写一次，浏览器会记住</p>
  <label>GitHub Token</label>
  <input id="tk" placeholder="粘贴你的Token">
  <label>管理密码</label>
  <input id="pw" type="password" placeholder="hoyo2010">
  <button class="btn" style="width:100%;text-align:center;margin-top:12px" onclick="login()">登录并测试</button>
  <div class="tip">Token 在 GitHub → Settings → Developer settings → Personal access tokens 生成（勾 repo）<br>登录时会自动检测有效性；管理密码默认 hoyo2010</div>
</div>

<div id="main" style="display:none">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div><h1>📚 课表管理</h1><p class="sub">编辑分类/图片 → 点「🔄 同步到网站」→ 前台20秒内自动更新</p></div>
    <button class="btn g" onclick="location.reload()">退出登录</button>
  </div>

  <div class="card">
    <h2>⚙️ 网站名称</h2>
    <input id="siteTitle" placeholder="最新课表展示">
    <input id="siteDesc" placeholder="点击分类查看课表" style="margin-top:6px">
  </div>

  <div class="card">
    <h2>📁 分类管理</h2>
    <div style="display:flex;gap:6px">
      <input id="newName" placeholder="分类名（如：高三课表）" style="flex:2">
      <input id="newDesc" placeholder="描述(可选)" style="flex:2">
      <button class="btn" onclick="addCat()">➕</button>
    </div>
    <div id="catList" style="margin-top:10px"></div>
  </div>

  <div class="card" id="imgCard" style="display:none">
    <h2>🖼️ 图片：<span id="curCatN"></span></h2>
    <input type="file" id="file" accept="image/*" multiple>
    <button class="btn g" onclick="addPics()">⬆️ 添加图片</button>
    <div id="imgList" class="imgs"></div>
  </div>

  <div class="card" style="background:#eefbf3;border:1px solid #bfe8cd">
    <button class="btn pubbtn" onclick="sync()">🔄 同步到网站（上传所有改动）</button>
    <div id="st"></div>
  </div>
</div>

<script>
var DATA_KEY="gd_v2", TOKEN="", PW="hoyo2010", data={siteTitle:"最新课表展示",siteDesc:"点击分类查看课表",cats:[]}, cur=-1;
var API="https://api.github.com/repos/laogallery/laogallery.github.io/contents";
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function load(){try{var s=localStorage.getItem(DATA_KEY);data=s?JSON.parse(s):data;}catch(e){data={siteTitle:"最新课表展示",siteDesc:"点击分类查看课表",cats:[]};}}
function save(){localStorage.setItem(DATA_KEY,JSON.stringify(data));}
function login(){
  var t=document.getElementById("tk").value.trim(),p=document.getElementById("pw").value;
  if(p!==PW){alert("管理密码错误");return;}
  if(!t){alert("请输入GitHub Token");return;}
  fetch("https://api.github.com/user",{headers:{Authorization:"token "+t,"User-Agent":"gallery-admin"}})
  .then(function(r){if(!r.ok)throw 0;return r.json();})
  .then(function(u){
    if(u.login!=="laogallery"){alert("Token不属于本账号");return;}
    TOKEN=t;localStorage.setItem("gd_token",t);
    document.getElementById("loginBox").style.display="none";
    document.getElementById("main").style.display="block";
    loadCloud();
  }).catch(function(){alert("❌ Token无效或网络错误，请检查后重试");});
}
function gh(path,method,data2){
  return fetch(API+path,{method:method||"GET",headers:{"Authorization":"token "+TOKEN,"Accept":"application/vnd.github+json","User-Agent":"gallery-admin","Content-Type":"application/json"},body:data2?JSON.stringify(data2):undefined});
}
function b64u(s){return btoa(unescape(encodeURIComponent(s)));}
function db64(s){return decodeURIComponent(escape(atob(s)));}
function loadCloud(){
  setSt("正在从云端读取...");
  Promise.all([
    gh("/content/settings.json?t="+Date.now()).then(r=>r.ok?r.json():null).then(j=>{if(j)data.siteTitle=JSON.parse(db64(j.content)).siteTitle||data.siteTitle;if(j)data.siteDesc=JSON.parse(db64(j.content)).siteDesc||data.siteDesc;}).catch(()=>{}),
    gh("/content/index.json?t="+Date.now()).then(r=>r.ok?r.json():null).then(j=>{if(j)data.cats=JSON.parse(db64(j.content));}).catch(()=>{})
  ]).then(function(){save();render();setSt("✅ 已读取云端数据");});
}
function render(){
  document.getElementById("siteTitle").value=data.siteTitle;
  document.getElementById("siteDesc").value=data.siteDesc;
  var b=document.getElementById("catList");b.innerHTML="";
  if(!data.cats.length){b.innerHTML='<div class="tip">还没有分类，先添加一个</div>';}
  data.cats.forEach(function(c,i){
    var d=document.createElement("div");d.className="cat";
    d.innerHTML='<div class="top"><div><span class="nm">'+esc(c.name)+'</span> <span class="cnt">'+(c.images?c.images.length:0)+' 张</span></div><div><button class="btn sm g" onclick="openCat('+i+')">📷 图</button><button class="btn sm g" onclick="editCat('+i+')">✏️</button><button class="btn sm g" onclick="mv('+i+',-1)">↑</button><button class="btn sm g" onclick="mv('+i+',1)">↓</button><button class="btn sm r" onclick="delCat('+i+')">🗑️</button></div></div>';
    b.appendChild(d);
  });
  if(cur>=0)renderImgs();
}
function addCat(){var n=document.getElementById("newName").value.trim();if(!n){alert("请输入分类名");return;}data.cats.push({name:n,desc:document.getElementById("newDesc").value.trim(),images:[]});document.getElementById("newName").value="";document.getElementById("newDesc").value="";save();render();setSt("已添加（点「同步到网站」生效）");}
function editCat(i){var n=prompt("分类名",data.cats[i].name);if(n==null)return;var d=prompt("描述",data.cats[i].desc||"");if(d==null)return;data.cats[i].name=n;data.cats[i].desc=d;save();render();setSt("已修改（点「同步」生效）");}
function delCat(i){if(!confirm("删除该分类？"))return;data.cats.splice(i,1);save();render();setSt("已删除（点「同步」生效）");}
function mv(i,dir){var j=i+dir;if(j<0||j>=data.cats.length)return;var t=data.cats[i];data.cats[i]=data.cats[j];data.cats[j]=t;save();render();}
function openCat(i){cur=i;document.getElementById("curCatN").textContent=data.cats[i].name;document.getElementById("imgCard").style.display="block";renderImgs();}
function renderImgs(){var b=document.getElementById("imgList");b.innerHTML="";(data.cats[cur].images||[]).forEach(function(im,j){var w=document.createElement("span");w.className="thumb";w.style.position="relative";w.innerHTML='<img src="'+im.src+'" style="width:56px;height:70px;object-fit:cover;border-radius:6px"><button class="x" onclick="delImg('+j+')">×</button>';b.appendChild(w);});}
function delImg(j){data.cats[cur].images.splice(j,1);save();renderImgs();setSt("已删除（点「同步」生效）");}
function addPics(){
  var fs=document.getElementById("file").files;if(!fs.length){alert("请选择图片");return;}
  var arr=Array.from(fs).filter(f=>f.type.startsWith("image/")),done=0;
  (function next(){
    if(done>=arr.length){save();renderImgs();document.getElementById("file").value="";setSt("已添加 "+arr.length+" 张（点「同步」生效）");return;}
    var f=arr[done],r=new FileReader();
    r.onload=function(e){var img=new Image();
      img.onload=function(){var max=1000,w=img.width,h=img.height;if(w>max){h=h*max/w;w=max;}var c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);data.cats[cur].images.push({src:c.toDataURL("image/jpeg",0.65),title:""});done++;next();};
      img.src=e.target.result;};
    r.readAsDataURL(f);
  })();
}
function setSt(m){document.getElementById("st").textContent=m;}
function putF(path,content,msg){
  return gh(path+"?t="+Date.now()).then(r=>r.ok?r.json():null).then(function(ex){
    var b2={message:msg,content:b64u(content),branch:"main"};
    if(ex&&ex.sha)b2.sha=ex.sha;
    return gh(path,"PUT",b2).then(function(r){return r.ok;});
  }).catch(function(){return false;});
}
function sync(){
  setSt("正在同步...");
  Promise.all([
    putF("/content/settings.json",JSON.stringify({siteTitle:data.siteTitle,siteDesc:data.siteDesc},null,0),"同步设置"),
    putF("/content/index.json",JSON.stringify(data.cats,null,0),"同步分类数据")
  ]).then(function(res){
    if(res[0]&&res[1]){setSt("✅ 同步成功！前台20秒内自动更新");alert("✅ 已同步到网站，前台马上更新");}
    else{setSt("❌ 同步失败：Token可能无效，请重新登录（退出后重新填Token）");alert("❌ 同步失败：Token无效或网络错误\n请点右上角「退出登录」重新输入Token");}
  });
}
// 启动
var t=localStorage.getItem("gd_token");
if(t){TOKEN=t;
  fetch("https://api.github.com/user",{headers:{Authorization:"token "+t,"User-Agent":"gallery-admin"}})
  .then(r=>r.ok?r.json():null).then(u=>{if(u&&u.login==="laogallery"){document.getElementById("loginBox").style.display="none";document.getElementById("main").style.display="block";loadCloud();}}).catch(()=>{});
}
load();
</script>
</body>
</html>
