<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;background:#fff;color:#111;max-width:720px;margin:0 auto;-webkit-tap-highlight-color:transparent}
.hd{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 8px}
.hd .t{font-size:26px;font-weight:700;letter-spacing:-.5px;color:#1e3a8a}
.hd .x{font-size:15px;color:#2563eb;background:none;border:none;cursor:pointer}
.crumb{padding:4px 20px 10px;font-size:14px;color:#2563eb;display:none;flex-wrap:wrap;gap:3px}
.crumb span{cursor:pointer}
.crumb .s{color:#94a3b8;margin:0 4px}
.list{background:#fff;padding:0 20px}
.row{display:flex;align-items:center;padding:15px 2px;border-bottom:1px solid #f1f5f9;cursor:pointer}
.row:last-child{border-bottom:none}
.row .ic{width:46px;height:46px;border-radius:10px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:24px;margin-right:14px}
.row .tx{flex:1}
.row .tx .n{font-size:17px;font-weight:600}
.row .tx .m{font-size:13px;color:#64748b;margin-top:2px}
.row .ar{color:#94a3b8;font-size:20px}
.empty{padding:80px 20px;text-align:center;color:#94a3b8;font-size:15px}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(20px);border-top:0.5px solid #dbeafe;display:flex;max-width:720px;margin:0 auto;padding:6px 0 calc(8px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;background:none;border:none;padding:4px 0;font-size:10px;color:#64748b;cursor:pointer}
.tabbar button .i{font-size:23px;display:block;margin-bottom:2px}
.tabbar button.on{color:#2563eb}
.page{display:none;padding-bottom:110px}
.page.on{display:block}
.big{background:#2563eb;color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:600;width:100%;padding:16px;cursor:pointer}
.big:disabled{background:#94a3b8}
.gray{color:#64748b;font-size:12px;text-align:center;margin-top:8px}
.up{text-align:center;padding:40px 24px 4px}
.up .tar{color:#2563eb;font-size:16px;background:#f1f5f9;border:none;border-radius:12px;padding:13px 18px;width:100%;cursor:pointer;margin-bottom:26px}
.up .plus{width:96px;height:96px;border-radius:22px;background:#f1f5f9;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:40px;color:#2563eb;cursor:pointer}
.pv{display:flex;flex-wrap:wrap;gap:10px;padding:20px}
.pv .it{position:relative;width:84px}
.pv img,.pv video{width:84px;height:104px;object-fit:cover;border-radius:10px;background:#f1f5f9}
.pv .rm{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.75);color:#fff;border:none;font-size:13px;line-height:22px}
.btn{background:#f1f5f9;border:none;border-radius:10px;padding:13px;font-size:16px;width:100%;margin-top:10px;cursor:pointer}
.sheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;align-items:flex-end}
.sheet .b{background:#fff;border-radius:16px 16px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-height:75%;overflow-y:auto;width:100%}
.sheet .grab{width:40px;height:5px;background:#dbeafe;border-radius:3px;margin:6px auto 12px}
.sheet .it2{padding:15px 8px;border-bottom:1px solid #f1f5f9;font-size:16px;display:flex;justify-content:space-between}
.sheet .it2:last-child{border-bottom:none}
.sheet .can{padding:13px;text-align:center;color:#2563eb;font-size:16px;border:none;background:#f1f5f9;width:100%;border-radius:12px;margin-top:10px;cursor:pointer}
.tMenu{background:#fff;border-bottom:0.5px solid #dbeafe;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
.tMenu button{background:none;border:1px solid #dbeafe;color:#111;border-radius:20px;padding:6px 14px;font-size:14px;cursor:pointer}
input[type=text]{width:100%;padding:15px;border:0;border-bottom:1px solid #f1f5f9;font-size:17px;outline:none}
.set2{padding:4px 20px}
.set2 label{font-size:13px;color:#64748b;margin-top:14px;display:block}
</style>
</head>
<body>
<div class="hd"><div class="t">🎓 课表管理</div><button class="x" id="out" style="display:none" onclick="bye()">退出</button></div>
<div class="crumb" id="cr"><span onclick="go([])">首页</span></div>

<div class="page on" id="pg1">
  <div class="tMenu"><div id="curName" style="font-size:17px;font-weight:600"></div><div><button onclick="mk()">➕ 新建</button></div></div>
  <div class="list" id="list"></div>
</div>

<div class="page" id="pg2">
  <div class="up">
    <button class="tar" id="target" onclick="openT()">选择目标文件夹</button>
    <div class="plus" onclick="pick()">＋</div>
    <div class="gray">选择图片或视频</div>
    <input type="file" id="f" accept="image/*,video/*" multiple style="display:none">
  </div>
  <div class="pv" id="pv"></div>
  <div style="padding:0 20px">
    <button class="big" onclick="save()" id="saveBtn">保存到网站</button>
    <div class="gray" id="st"></div>
  </div>
</div>

<div class="page" id="pg3">
  <div class="set2">
    <label>网站标题</label><input type="text" id="st2">
    <label>副标题</label><input type="text" id="sd2">
  </div>
  <div style="padding:20px"><button class="btn" onclick="sw(1)">返回</button></div>
</div>

<div class="tabbar">
  <button id="tb1" class="on" onclick="sw(1)"><span class="i">◻️</span>分类</button>
  <button id="tb2" onclick="sw(2)"><span class="i">＋</span>上传</button>
  <button id="tb3" onclick="sw(3)"><span class="i">⚙️</span>设置</button>
</div>

<div class="sheet" id="tpick"><div class="b">
  <div class="grab"></div>
  <div id="tlist"></div>
</div></div>
<div class="sheet" id="cmds"><div class="b">
  <div class="grab"></div>
  <div id="cList"></div>
  <button class="can" onclick="cs()">取消</button>
</div></div>

<div class="sheet" id="lg2"><div class="b" style="text-align:center">
  <div style="font-size:20px;font-weight:700;margin:10px 0 4px;color:#1e3a8a">登录</div>
  <div class="gray" style="margin-bottom:14px">Token + 密码（记住一次）</div>
  <input type="text" id="tk" placeholder="GitHub Token" style="border:1px solid #dbeafe;border-radius:12px;margin-bottom:6px">
  <input type="password" id="pw" placeholder="密码 hoyo2010" style="border:1px solid #dbeafe;border-radius:12px;margin-bottom:12px">
  <button class="big" onclick="login()">进入</button>
</div></div>

<script>
var K="gd_v7",TOKEN="",PW="hoyo2010",D={t:"课表",s:"点击分类查看",cats:[]},nav=[],target=null,pend=[],cmdI=-1;
var API="https://api.github.com/repos/laogallery/laogallery.github.io/contents";
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function node(){var n=D.cats;for(var i=0;i<nav.length;i++)n=n[nav[i]].children||[];return n;}
function nd(){if(target===null)return null;var n=D.cats;for(var i=0;i<target.length;i++)n=n[target[i]].children||[];return n[target[target.length-1]];}
function ld(){try{var s=localStorage.getItem(K);if(s){var d=JSON.parse(s);if(d&&d.cats)D=d;}}catch(e){}}
function sv(){try{var c=JSON.parse(JSON.stringify(D));(function w(a){a.forEach(function(x){x.media=(x.media||[]).map(function(m){return m.t==="vid"?{t:m.t,s:m.s}:{t:m.t,s:m.s,d:m.d};});w(x.children||[]);});})(c.cats);localStorage.setItem(K,JSON.stringify(c));}catch(e){}}
function st(m){document.getElementById("st").textContent=m;}
function sw(i){for(var k=1;k<=3;k++)document.getElementById("pg"+k).className="page"+(i===k?" on":"");for(var k2=1;k2<=3;k2++)document.getElementById("tb"+k2).className=i===k2?"on":"";if(i===2)sh2();}
function cs(){document.getElementById("cmds").style.display="none";document.getElementById("tpick").style.display="none";}
function login(){
  var t=document.getElementById("tk").value.trim(),p=document.getElementById("pw").value;
  if(p!==PW){alert("密码错误");return;}
  if(!t){alert("请输入Token");return;}
  fetch("https://api.github.com/user",{headers:{Authorization:"token "+t,"User-Agent":"ga"}})
  .then(function(r){if(!r.ok)throw 0;return r.json();})
  .then(function(u){if(u.login!=="laogallery"){alert("Token不属于本账号");return;}TOKEN=t;localStorage.setItem("gd_tk",t);document.getElementById("lg2").style.display="none";document.getElementById("out").style.display="block";loadC();})
  .catch(function(){alert("Token无效");});
}
function bye(){localStorage.removeItem("gd_tk");location.reload();}
function gh(p,m,d2){return fetch(API+p,{method:m||"GET",headers:{"Authorization":"token "+TOKEN,"User-Agent":"ga","Content-Type":"application/json"},body:d2?JSON.stringify(d2):undefined});}
function b64u(s){return btoa(unescape(encodeURIComponent(s)));}
function d64(s){return decodeURIComponent(escape(atob(s)));}
function mig(x){if(!x.media&&x.images){x.media=x.images.map(function(im){return {t:"img",s:im.src};});}x.media=x.media||[];x.children=(x.children||[]).map(mig);return x;}
function loadC(){
  Promise.all([
    gh("/content/settings.json?t="+Date.now()).then(r=>r.ok?r.json():null).then(j=>{if(j){var s=JSON.parse(d64(j.content));D.t=s.siteTitle||D.t;D.s=s.siteDesc||D.s;}}).catch(()=>{}),
    gh("/content/index.json?t="+Date.now()).then(r=>r.ok?r.json():null).then(j=>{if(j){D.cats=JSON.parse(d64(j.content)).map(mig);}}).catch(()=>{})
  ]).then(function(){sv();sh1();document.getElementById("st2").value=D.t;document.getElementById("sd2").value=D.s;});
}
function sh1(){
  var cr=document.getElementById("cr");cr.style.display=nav.length?"flex":"none";
  var h='<span onclick="go([])">首页</span>';var names=[],n=D.cats;
  for(var i=0;i<nav.length;i++){names.push(n[nav[i]]?n[nav[i]].name:"?");n=n[nav[i]].children||[];}
  for(var k=0;k<names.length;k++){h+='<span class="s">/</span><span onclick="go('+JSON.stringify(nav.slice(0,k+1))+')">'+esc(names[k])+'</span>';}
  cr.innerHTML=h;
  document.getElementById("curName").textContent=nav.length?names[names.length-1]:"我的分类";
  var lv=node(),l=document.getElementById("list");l.innerHTML="";
  if(!lv.length)l.innerHTML='<div class="empty">还没有分类<br>点右上角「➕ 新建」</div>';
  lv.forEach(function(c,i){
    var kids=(c.children||[]).length,ms=(c.media||[]).length;
    var r=document.createElement("div");r.className="row";
    r.innerHTML='<div class="ic">'+(c.pwHash?"🔒":"📁")+'</div><div class="tx"><div class="n">'+esc(c.name)+'</div><div class="m">'+(kids?"子分类 "+kids:"媒体 "+ms)+'</div></div><div class="ar">›</div>';
    r.onclick=function(){act(i);};
    l.appendChild(r);
  });
}
function go(p){nav=p;sh1();}
function act(i){
  cmdI=i;var c=node()[i];cs();
  var l=document.getElementById("cList");l.innerHTML="";
  var acts=[["打开分类",function(){if(nav.length>=2){alert("最多三级");return;}nav=nav.concat([i]);sh1();}],
            ["重命名",function(){var n=prompt("新名字",c.name);if(n){c.name=n;sv();sh1();}}],
            ["设置密码",function(){var p=prompt("输入密码（为空则取消密码）");if(p==null)return;if(!p){c.pwHash="";sv();sh1();}else sha256(p).then(function(h){c.pwHash=h;sv();sh1();});}],
            ["🔒 上传媒体到这里",function(){target=nav.concat([i]);var lab=pathName(target);document.getElementById("target").textContent=lab;sw(2);}],
            ["删除",function(){if(confirm("删除「"+c.name+"」？")){node().splice(i,1);sv();sh1();}}]];
  acts.forEach(function(a){
    var r=document.createElement("div");r.className="it2";r.innerHTML='<span>'+a[0]+'</span>';
    r.onclick=function(){cs();a[1]();};
    l.appendChild(r);
  });
  document.getElementById("cmds").style.display="flex";
}
function pathName(p){var n=D.cats,lab="";for(var i=0;i<p.length;i++){lab=lab?lab+" / "+n[p[i]].name:n[p[i]].name;n=n[p[i]].children||[];}return lab;}
function mk(){
  if(nav.length>=2){alert("已达三级上限");return;}
  var n=prompt("分类名称：");if(!n)return;
  node().push({name:n,desc:"",pwHash:"",media:[],children:[]});sv();sh1();
}
function sha256(s){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0");}).join("");});}
function openT(){
  var l=document.getElementById("tlist");l.innerHTML="";
  (function walk(a,path,label){a.forEach(function(c,i){
    var p2=path.concat([i]);var lab=label?label+" / "+c.name:c.name;
    var r=document.createElement("div");r.className="it2";
    r.innerHTML='<span>'+(c.pwHash?"🔒 ":"📁 ")+esc(lab)+'</span><span style="color:#94a3b8">'+c.media.length+'</span>';
    r.onclick=function(){target=p2;document.getElementById("target").textContent=pathName(p2);cs();sh2();};
    l.appendChild(r);
    walk(c.children||[],p2,lab);
  });})(D.cats,[],"");
  document.getElementById("tpick").style.display="flex";
}
function pick(){if(target===null){alert("先选目标文件夹");return;}document.getElementById("f").click();}
function sh2(){
  var pv=document.getElementById("pv");pv.innerHTML="";
  document.getElementById("target").textContent=target===null?"选择目标文件夹":pathName(target);
  if(!pend.length&&target!==null){
    var mc=nd().media;
    if(mc.length){var h=document.createElement("div");h.className="gray";h.style.width="100%";h.textContent="已有 "+mc.length+" 个媒体：";pv.appendChild(h);}
    mc.forEach(function(m,j){
      var w=document.createElement("div");w.className="it";
      w.innerHTML=(m.t==="vid"?'<video src="'+m.s+'" style="width:84px;height:104px;object-fit:cover;background:#f1f5f9"></video>':'<img src="'+m.s+'">')+'<button class="rm" onclick="rmm('+j+')">×</button>';
      pv.appendChild(w);
    });
  }
  pend.forEach(function(m,j){
    var w=document.createElement("div");w.className="it";
    w.innerHTML=(m.t==="vid"?'<video src="'+m.d+'" style="width:84px;height:104px;object-fit:cover;background:#f1f5f9"></video>':'<img src="'+m.d+'">')+'<button class="rm" onclick="rmp('+j+')">×</button>';
    pv.appendChild(w);
  });
}
function rmm(j){nd().media.splice(j,1);sv();sh2();}
function rmp(j){var it=pend[j];if(it){var mi=nd().media.indexOf(it);if(mi>=0)nd().media.splice(mi,1);}pend.splice(j,1);sv();sh2();}
document.getElementById("f").onchange=function(){
  if(target===null){alert("先选目标文件夹");this.value="";return;}
  var arr=Array.from(this.files),done=0,t0=Date.now();
  (function nx(){
    if(done>=arr.length){sv();sh2();document.getElementById("f").value="";st("已选 "+arr.length+" 个，点保存");return;}
    var f=arr[done];
    if(f.type.startsWith("video/")){
      if(f.size>60*1024*1024){alert("视频超60MB");done++;nx();return;}
      var r=new FileReader();r.onload=function(e){var it={t:"vid",s:"/media/v_"+t0+"_"+done+"."+(f.name.split(".").pop()||"mp4"),d:e.target.result};nd().media.push(it);pend.push(it);done++;nx();};r.readAsDataURL(f);
    }else if(f.type.startsWith("image/")){
      var r2=new FileReader();r2.onload=function(e){var im=new Image();im.onload=function(){var w=900,h=im.height*900/im.width;var c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);var it={t:"img",s:"/media/img_"+t0+"_"+done+".jpg",d:c.toDataURL("image/jpeg",0.55)};nd().media.push(it);pend.push(it);done++;nx();};im.src=e.target.result;};r2.readAsDataURL(f);
    }else{done++;nx();}
  })();
};
function ghPut(p,ct,rt){
  return gh(p+"?t="+Date.now()).then(r=>r.ok?r.json():null).then(function(ex){
    var b={message:"sync",content:b64u(ct),branch:"main"};if(ex&&ex.sha)b.sha=ex.sha;
    return gh(p,"PUT",b).then(function(r){if(r.ok)return true;if(rt>0)return ghPut(p,ct,rt-1);return false;});
  }).catch(function(){if(rt>0)return ghPut(p,ct,rt-1);return false;});
}
function save(){
  st("保存中...");var tasks=[];
  (function col(a){a.forEach(function(x){x.media.forEach(function(m){if(m.d&&m.s.indexOf("media/")>=0){var b=m.d.indexOf(",")>=0?m.d.substring(m.d.indexOf(",")+1):m.d;tasks.push({p:m.s,b:b});m.d="";}});col(x.children||[]);});})(D.cats);
  var i=0;
  (function nx(){
    if(i>=tasks.length){sv();pend=[];sh2();
      var clean=JSON.parse(JSON.stringify(D));
      (function w(a){a.forEach(function(x){x.media=(x.media||[]).map(function(m){return {t:m.t,s:m.s};});w(x.children||[]);});})(clean.cats);
      Promise.all([
        ghPut("/content/settings.json",JSON.stringify({siteTitle:D.t,siteDesc:D.s})),
        ghPut("/content/index.json",JSON.stringify(clean.cats))
      ]).then(function(rr){
        if(rr[0]&&rr[1]){st("✅ 已保存");alert("✅ 已保存到网站");}
        else{alert("❌ 保存失败，请重试");st("❌ 保存失败");}
      });
      return;
    }
    st("上传 "+(i+1)+"/"+tasks.length+" ...");
    ghPut("/"+tasks[i].p.replace(/^\//,""),tasks[i].b,1).then(function(ok){if(!ok)alert("媒体上传失败："+tasks[i].p);i++;nx();});
  })();
}
document.getElementById("st2").onchange=function(){D.t=this.value;};
document.getElementById("sd2").onchange=function(){D.s=this.value;};
var t=localStorage.getItem("gd_tk");
if(t){TOKEN=t;fetch("https://api.github.com/user",{headers:{Authorization:"token "+t,"User-Agent":"ga"}}).then(r=>r.ok?r.json():null).then(function(u){if(u&&u.login==="laogallery"){document.getElementById("lg2").style.display="none";document.getElementById("out").style.display="block";loadC();}}).catch(()=>{});
}else{document.getElementById("lg2").style.display="flex";}
ld();
</script>
</body>
</html>
